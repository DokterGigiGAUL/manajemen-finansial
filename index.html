<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
  
<body class="bg-gradient-to-b from-sky-800 from-[20%] to-neutral-200 to-[20%] p-4 font-sans text-gray-800">
  <div class="max-w-md mx-auto"> 
    
    <div class="mb-5 text-white"> 
      <p class="text-xs font-bold uppercase tracking-widest mb-2 opacity-90 text-center">Total Pengeluaran Bulan Ini</p>
      <h1 id="totalBulanIni" class="text-4xl font-bold leading-none text-center">Rp. 0</h1>
      <p id="namaBulan" class="text-sm mt-2 opacity-80 text-center">Loading...</p>
    </div>

    <div class="bg-white rounded-3xl p-6 shadow-sm border border-white mb-5"> 
      <h3 class="text-xl font-bold mb-1 flex items-center">
        <span class="w-1.5 h-6 bg-purple-600 rounded-full mr-3"></span>Rekap Hari Ini
      </h3>
      <h2 id="totalHariIni" class="text-2xl font-bold">Rp. 0</h2>
      
      <hr class="my-4 border-gray-100">

      <div id="listRekap">
        <p class="text-center text-gray-400 text-sm py-4">Memuat rincian...</p>
      </div>
    </div>

    <div class="flex items-center justify-between mb-5 px-2">
      <button onclick="changeMonth(-1)" class="w-10 h-10 flex items-center justify-center bg-white rounded-full shadow-sm text-sky-800 font-bold">&larr;</button>
      <div class="text-center bg-white/20 backdrop-blur-md px-4 py-2 rounded-2xl border border-white/30 text-white font-semibold" id="monthLabel">Januari 2026</div>
      <button onclick="changeMonth(1)" class="w-10 h-10 flex items-center justify-center bg-white rounded-full shadow-sm text-sky-800 font-bold">&rarr;</button>
    </div>

    <div class="bg-white rounded-3xl p-6 shadow-sm border border-white mb-5">
      <div class="flex bg-gray-100 p-1 rounded-2xl mb-6">
        <button id="btn-pengeluaran" onclick="switchTab('pengeluaran')" class="flex-1 py-2.5 rounded-xl text-sm font-bold transition-all bg-white shadow-sm text-gray-800">Pengeluaran</button>
        <button id="btn-pemasukan" onclick="switchTab('pemasukan')" class="flex-1 py-2.5 rounded-xl text-sm font-bold transition-all text-gray-500 hover:text-gray-700">Pemasukan</button>
      </div>
      <div class="relative h-64 mb-4">
        <canvas id="pieChart"></canvas>
      </div>
      <div id="legendContainer" class="space-y-3 mt-6"></div>
    </div>

    <div class="bg-white rounded-3xl p-6 shadow-sm border border-white mb-20">
      <h3 class="text-lg font-bold mb-6 flex items-center">
        <span class="w-1.5 h-5 bg-purple-600 rounded-full mr-3"></span>Pengeluaran Terbanyak
      </h3>
      <div class="h-64">
        <canvas id="barChart"></canvas>
      </div>
    </div>
  </div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbyC-8Fp634H6S880B1vOa_A69Xm7fI_98A-kCscM5n232R83zHn0G4wS365XN7mOyoK/exec"; // URL Anda
let currentViewDate = new Date();
let currentPieChart = null;
let currentBarChart = null;
let globalData = null;

window.onload = () => {
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();
    fetchData();
};

async function fetchData() {
    const m = currentViewDate.getMonth() + 1;
    const y = currentViewDate.getFullYear();
    
    try {
        // Cache busting agar data selalu segar
        const response = await fetch(`${GAS_URL}?action=getData&month=${m}&year=${y}&v=${new Date().getTime()}`);
        const data = await response.json();
        globalData = data;

        updateSummary(data);
        drawCharts(data);
        renderRekap(data.rekapHariIni);
        updateMonthlyBreakdown(data);
        
    } catch (error) {
        console.error("Gagal mengambil data:", error);
    }
}

function updateSummary(data) {
    if (!data) return;
    
    const totalBulan = document.getElementById('totalBulanIni');
    const totalHari = document.getElementById('totalHariIni');
    const namaBulan = document.getElementById('namaBulan');

    if (totalBulan) totalBulan.textContent = 'Rp. ' + (data.totalBulanIni || 0).toLocaleString('id-ID');
    if (totalHari) totalHari.textContent = 'Rp. ' + (data.totalHariIni || 0).toLocaleString('id-ID');
    
    if (namaBulan && data.monthlyBreakdown) {
        namaBulan.textContent = data.monthlyBreakdown.monthName + " " + data.monthlyBreakdown.year;
    }
}

function renderRekap(rekap) {
    const container = document.getElementById('listRekap');
    if (!container) return;

    if (!rekap || rekap.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-400 text-sm py-4">Tidak ada transaksi hari ini</p>';
        return;
    }

    container.innerHTML = rekap.map(item => `
        <div class="flex items-center justify-between py-3 border-b border-gray-50 last:border-0">
            <div>
                <p class="font-semibold text-gray-800 text-sm">${item.kategori || 'Lainnya'}</p>
                <p class="text-xs text-gray-400">${item.item || '-'}</p>
            </div>
            <p class="font-bold text-gray-900 text-sm">Rp. ${(item.nominal || 0).toLocaleString('id-ID')}</p>
        </div>
    `).join('');
}

function switchTab(type) {
    const btnExp = document.getElementById('btn-pengeluaran');
    const btnInc = document.getElementById('btn-pemasukan');
    
    if (type === 'pengeluaran') {
        btnExp.className = 'flex-1 py-2.5 rounded-xl text-sm font-bold transition-all bg-white shadow-sm text-gray-800';
        btnInc.className = 'flex-1 py-2.5 rounded-xl text-sm font-bold transition-all text-gray-500 hover:text-gray-700';
        updatePieChart(globalData.kategoriLabels, globalData.kategoriValues, '#F43F5E');
    } else {
        btnInc.className = 'flex-1 py-2.5 rounded-xl text-sm font-bold transition-all bg-white shadow-sm text-gray-800';
        btnExp.className = 'flex-1 py-2.5 rounded-xl text-sm font-bold transition-all text-gray-500 hover:text-gray-700';
        updatePieChart(globalData.pemasukanLabels, globalData.pemasukanValues, '#10B981');
    }
}

function updatePieChart(labels, values, color) {
    const ctx = document.getElementById('pieChart').getContext('2d');
    if (currentPieChart) currentPieChart.destroy();

    currentPieChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: labels,
            datasets: [{
                data: values,
                backgroundColor: labels.map((_, i) => `${color}${Math.max(20, 100 - (i * 15)).toString(16)}`),
                borderWidth: 0,
                hoverOffset: 10
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '75%',
            plugins: { legend: { display: false } }
        }
    });

    // Update Legend Manual
    const legendContainer = document.getElementById('legendContainer');
    const total = values.reduce((a, b) => a + b, 0);
    
    legendContainer.innerHTML = labels.map((label, i) => {
        const percent = total > 0 ? Math.round((values[i] / total) * 100) : 0;
        return `
            <div class="flex items-center justify-between group">
                <div class="flex items-center gap-3">
                    <div class="w-2.5 h-2.5 rounded-full" style="background-color: ${currentPieChart.data.datasets[0].backgroundColor[i]}"></div>
                    <span class="text-sm font-medium text-gray-600">${label}</span>
                </div>
                <div class="flex items-center gap-4">
                    <span class="text-xs font-bold text-gray-400">${percent}%</span>
                    <span class="text-sm font-bold text-gray-800">Rp. ${values[i].toLocaleString('id-ID')}</span>
                </div>
            </div>
        `;
    }).join('');
}

function drawCharts(data) {
    // Default tab pengeluaran
    switchTab('pengeluaran');

    // Bar Chart
    const canvasBar = document.getElementById('barChart');
    if (!canvasBar) return;
    if (currentBarChart) currentBarChart.destroy();

    currentBarChart = new Chart(canvasBar.getContext('2d'), {
        type: 'bar',
        data: {
            labels: (data.itemLabels || []).map((item, index) => [data.itemKategori[index] || '', item]),
            datasets: [{
                label: 'Nominal',
                data: data.itemValues || [],
                backgroundColor: 'rgba(139, 92, 246, 1)',
                borderRadius: 4,
                barThickness: 16
            }]
        },
        options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { display: false },
                y: {
                    grid: { display: false },
                    ticks: { padding: 10, font: { size: 10 } }
                }
            },
            plugins: { legend: { display: false } }
        }
    });
}

function updateMonthlyBreakdown(data) {
    const mb = data.monthlyBreakdown;
    if (!mb) return;
    document.getElementById('monthLabel').innerText = mb.monthName + " " + mb.year;
}

function changeMonth(offset) {
    currentViewDate.setMonth(currentViewDate.getMonth() + offset);
    fetchData();
}
</script>
</body>
</html>
