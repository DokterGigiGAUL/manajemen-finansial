<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gradient-to-b from-sky-800 from-[20%] to-neutral-200 to-[20%] p-4 font-sans text-gray-800">
  <div class="max-w-md mx-auto">
    
    Total Pengeluaran Bulan Ini
    <div class="bg-gradient-to-br from-cyan-700 to-sky-800 rounded-3xl p-6 shadow-lg mb-5 text-white">
      <p class="text-xs font-bold uppercase tracking-widest mb-1 opacity-90 text-center">Total Pengeluaran Bulan Ini</p>
      <h1 id="totalBulanIni" class="text-4xl font-bold leading-none text-center">Rp. 0</h1>
      <p id="namaBulan" class="text-sm mt-2 opacity-80 text-center">Loading...</p>
    </div>

    <!-- Rekap Harian Hari Ini -->
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-white mb-5">
      <h3 class="text-xl font-bold mb-3 flex items-center">
        <span class="w-2 h-4 bg-red-500 rounded-full mr-2 hidden"></span> Pengeluaran Hari Ini
      </h3>
        <span id="totalHariIni" class="text-2xl font-bold text-red-500 mb-2">Rp. 0</span>
      <div id="rekapHariIni" class="-space-y-2">
        <p class="text-gray-400 text-sm">Memuat data...</p>
      </div>
 <!--     <div class="mt-2 pt-2 border-t border-gray-100">
        <div class="flex justify-between items-center">
          <span class="text-base font-semibold text-gray-600">Total Hari Ini:</span>
          <span id="totalHariIni" class="text-lg font-bold text-red-500">Rp. 0</span>
        </div>
      </div>-->
    </div>

    <!-- Grafik Doughnut - Kategori 
    <div class="bg-white rounded-3xl p-5 border-white mb-5">
      <p class="text-xs font-light uppercase tracking-widest mb-1 text-left">Statistik</p>
      <h3 class="text-xl font-bold mb-6 flex items-center">
        <span class="w-2 h-4 bg-amber-500 rounded-full mr-2 hidden"></span> Kategori Pengeluaran
      </h3>
      <div class="aspect-square">
        <canvas id="pieChart"></canvas>
      </div>
    </div>-->
    <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 mb-5">
  <div class="flex border-b border-gray-100 mb-6">
    <button id="tabPengeluaran" onclick="switchTab('pengeluaran')" class="flex-1 pb-3 text-sm font-bold border-b-2 border-rose-600 text-rose-600 transition-all">
      Pengeluaran
    </button>
    <button id="tabPemasukan" onclick="switchTab('pemasukan')" class="flex-1 pb-3 text-sm font-bold border-b-2 border-transparent text-gray-400 transition-all">
      Pemasukan
    </button>
  </div>
  
  <div class="aspect-square relative">
    <canvas id="pieChart"></canvas>
  </div>
</div>

    <!-- Grafik Bar - 7 Hari Terakhir per Item -->
    <div class="bg-white rounded-3xl p-5 border border-white">
      <h3 class="text-xl font-bold mb-2 flex items-center">
        <span class="w-2 h-4 bg-sky-600 rounded-full mr-2 hidden"></span> Pengeluaran Terbanyak
      </h3>
      <h3 class="text-base font-medium mb-4 flex items-center text-gray-500">
        <span class="w-2 h-4 bg-sky-600 rounded-full mr-2 hidden"></span> 7 hari terakhir
      </h3>
      <div class="relative aspect-[4/3] w-full">
        <canvas id="barChart"></canvas>
      </div>
    </div>
  </div>

<script>
    // 1. KONFIGURASI - PASTIKAN URL INI BENAR
    const GAS_URL = "URL_WEB_APP_GAS_ANDA"; 
    const tg = window.Telegram.WebApp;
    tg.expand();

    // 2. STATE MANAGEMENT
    let chartData = null; 
    let currentPieChart = null;

    // 3. FUNGSI UTAMA AMBIL DATA
    async function fetchData() {
      showLoading(true);
      try {
        const response = await fetch(GAS_URL + '?action=getData');
        const data = await response.json();
        
        // Simpan ke global agar bisa diakses fungsi lain
        chartData = data; 

        // Tampilkan Saldo (URUTAN PERTAMA AGAR SALDO MUNCUL DULU)
        updateSummary(data); 
        
        // Gambar Grafik (URUTAN KEDUA)
        drawCharts(data);    
        
        // Rekap (URUTAN KETIGA)
        renderRekap(data.rekapHariIni);

      } catch (error) {
        console.error('Fatal Error:', error);
        // Tampilkan error langsung di layar jika saldo tidak muncul
        const errorDiv = document.createElement('div');
        errorDiv.className = "bg-red-100 text-red-700 p-4 rounded-xl m-4 text-xs font-mono";
        errorDiv.innerHTML = "<b>Sistem Error:</b> " + error.message;
        document.body.prepend(errorDiv);
      } finally {
        showLoading(false);
      }
    }

    function updateSummary(data) {
      if (!data) return;
      const elBulan = document.getElementById('totalBulanIni');
      const elHari = document.getElementById('totalHariIni');
      const elNamaBulan = document.getElementById('namaBulan');

      if (elBulan) elBulan.textContent = 'Rp. ' + (data.totalBulanIni || 0).toLocaleString('id-ID');
      if (elHari) elHari.textContent = 'Rp. ' + (data.totalHariIni || 0).toLocaleString('id-ID');
      
      const skrg = new Date();
      if (elNamaBulan) elNamaBulan.textContent = skrg.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
    }

    function updatePieChart(labels, values, color) {
      const canvas = document.getElementById('pieChart');
      if (!canvas) return;
      
      if (currentPieChart) currentPieChart.destroy();
      
      const ctx = canvas.getContext('2d');
      currentPieChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels || [],
          datasets: [{
            data: values || [],
            backgroundColor: [color, '#FB923C', '#FBBF24', '#34D399', '#60A5FA', '#A78BFA'],
            borderWidth: 3,
            borderColor: '#fff'
          }]
        },
        options: {
          cutout: '65%',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { usePointStyle: true, padding: 15, font: { size: 11 } } }
          }
        }
      });
    }

    function switchTab(type) {
      if (!chartData) return;
      
      const btnKeluar = document.getElementById('tabPengeluaran');
      const btnMasuk = document.getElementById('tabPemasukan');
      
      if (type === 'pengeluaran') {
        btnKeluar.className = "flex-1 pb-3 text-sm font-bold border-b-2 border-rose-600 text-rose-600 transition-all";
        btnMasuk.className = "flex-1 pb-3 text-sm font-bold border-b-2 border-transparent text-gray-400 transition-all";
        updatePieChart(chartData.kategoriLabels, chartData.kategoriValues, '#F43F5E');
      } else {
        btnKeluar.className = "flex-1 pb-3 text-sm font-bold border-b-2 border-transparent text-gray-400 transition-all";
        btnMasuk.className = "flex-1 pb-3 text-sm font-bold border-b-2 border-sky-600 text-sky-600";
        updatePieChart(chartData.pemasukanLabels, chartData.pemasukanValues, '#0284C7');
      }
    }

    function drawCharts(data) {
      // Inisialisasi awal Pie Chart (Pengeluaran)
      updatePieChart(data.kategoriLabels, data.kategoriValues, '#F43F5E');

      // Bar Chart - Top 5
      const canvasBar = document.getElementById('barChart');
      if (!canvasBar) return;

      new Chart(canvasBar.getContext('2d'), {
        type: 'bar',
        data: {
          labels: (data.itemLabels || []).map((item, index) => [data.itemKategori[index] || '', item]),
          datasets: [{
            label: 'Nominal',
            data: data.itemValues || [],
            backgroundColor: 'rgba(16, 185, 129, 1)',
            borderRadius: 5,
            barThickness: 10
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { display: false },
            y: {
              grid: { display: false },
              ticks: { padding: 10, font: { size: 10, weight: '600', lineHeight: 0.7 } }
            }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    function showLoading(show) {
      const l = document.getElementById('loading');
      const m = document.getElementById('mainContent');
      if (l) l.style.display = show ? 'flex' : 'none';
      if (m) m.style.display = show ? 'none' : 'block';
    }

    function renderRekap(rekap) {
      const container = document.getElementById('rekapHariIni');
      if (!container) return;
      if(!rekap || rekap.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-400 text-sm py-4">Tidak ada transaksi hari ini</p>';
        return;
      }
      container.innerHTML = rekap.map(item => `
        <div class="flex items-center justify-between p-4 bg-gray-50 rounded-2xl mb-3 border border-gray-100">
          <div>
            <p class="font-bold text-gray-900">${item.kategori}</p>
            <p class="text-xs text-gray-500">${item.items}</p>
          </div>
          <p class="font-bold text-rose-600 text-right">Rp. ${item.nominal.toLocaleString('id-ID')}</p>
        </div>
      `).join('');
    }

    // Jalankan eksekusi
    fetchData();
</script>
</body>
</html>
