<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gradient-to-b from-gray-200 from-[20%] to-gray-200 to-[20%] p-6 font-[Helvetica] font-sans text-gray-800">
  <div class="max-w-md mx-auto">
    <div class="p-4 mb-4 text-black font-sans">
      <p class="text-xs font-semibold uppercase tracking-widest mb-1 opacity-90 text-center">Total Pengeluaran Bulan Ini</p>
      <h1 id="totalBulanIni" class="text-4xl font-bold leading-none text-center">Rp. 0</h1>
      <p id="namaBulan" class="text-sm mt-2 opacity-80 text-center">Loading...</p>
    </div>

    <!-- Rekap Harian Hari Ini -->
    <div class="bg-white rounded-3xl p-4 mb-6">
      <h3 class="text-lg font-bold mb-1 flex items-center">
        <span class="w-2 h-4 bg-red-500 rounded-full mr-2 hidden"></span> Pengeluaran Hari Ini
      </h3>
        <span id="totalHariIni" class="text-xl font-semibold text-red-500 mb-1">Rp. 0</span>
      <div id="rekapHariIni" class="-space-y-2">
        <p class="text-gray-400 text-sm mt-2">Memuat data...</p>
      </div>
    </div>

        <!-- Grafik Rekap Bulanan -->
    <div class="bg-white rounded-3xl p-4 mb-6">
      <h3 class="text-lg font-bold mb-3 flex items-center">Rekapitulasi Bulanan</h3>
      <p id="namaBulan2" class="text-sm mt-1 mb-3 opacity-90 text-center text-grey-400"></p>
  <div class="flex bg-gray-300 border-gray-300 border-1 mb-8 rounded-lg w-64 mx-auto">
    <button id="tabPengeluaran" onclick="switchTab('pengeluaran')" class="flex text-sm text-gray-600 font-semibold border-gray-300 border-2 transition-all bg-white rounded-lg py-1 w-32 justify-center"> 
      Pengeluaran
    </button>
    <button id="tabPemasukan" onclick="switchTab('pemasukan')" class="flex w-32 text-sm text-gray-400 font-semibold bg-gray-300 border-2 border-gray-300 rounded-lg transition-all py-1 justify-center">
      Pemasukan
    </button>
  </div>
  
    <div class="aspect-square relative w-full">
      <canvas id="pieChart"></canvas>
    </div>
      <div class="flex justify-center -mt-2 mb-6">
  <button onclick="bukaHalamanRekap()" class="flex items-center gap-2 bg-sky-500 backdrop-blur-sm border border-sky-500 px-6 py-2.5 rounded-full shadow-sm text-white font-semibold text-sm hover:bg-white transition-all active:scale-95">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
    </svg>
    Lihat Rekap Detail
  </button>
</div>

<div id="halamanRekap" class="fixed inset-0 bg-neutral-100 z-50 translate-x-full transition-transform duration-300 ease-in-out overflow-y-auto hidden">
  <div class="p-6">
    <button onclick="tutupHalamanRekap()" class="flex items-center text-sky-500 font-normal mb-6 active:scale-95">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
      Kembali ke Laporan
    </button>

    <h2 class="text-2xl font-bold text-gray-800 mb-4">Rekap Transaksi</h2>
    <div id="isiRekapDetail" class="space-y-3">
      <p class="text-center text-gray-500 py-10">Memuat data...</p>
    </div>
  </div>
</div>
    </div>

    <!-- Grafik Bar - Pengeluaran Terbanyak 30 Hari -->
    <div class="bg-white rounded-3xl p-4 border border-white">
      <h3 class="text-lg font-bold mb-1 flex items-center">Pengeluaran Terbanyak</h3>
      <h3 id="namaBulanGrafik" class="text-base font-medium mb-2 flex items-center text-gray-500">
      </h3>

      <div class="relative aspect-[5/4] w-full mb-4">
        <canvas id="barChart"></canvas>
        
</div>
<div class="mt-4 border-t pt-4">
  <button onclick="toggleListPengeluaran()" class="flex items-center gap-2 bg-sky-500 backdrop-blur-sm border border-sky-500 px-6 py-2.5 rounded-full shadow-sm text-white font-semibold text-sm hover:bg-white transition-all active:scale-95">
    Riwayat Pengeluaran Lengkap ↓
  </button>
<div id="listPengeluaranDetail" class="hidden mt-4 space-y-2 max-h-60 overflow-y-auto pr-2 border-t pt-2">
  </div>
      </div>
    </div>
  </div>

    <script>
      // Letakkan di bagian paling atas script miniapp
let dataTerakhir = null;
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzBqdc-bxh88YCPWZ63CcF2xomeFQqgqAXX1k6s6VN6t6k4r9ldtngPrRPsBX0VVUQNxA/exec"; 
    const tg = window.Telegram.WebApp;
    tg.expand();

    let chartData = null; 
    let currentPieChart = null;
    let currentBarChart = null; // Tambahkan ini untuk tracking bar chart

    async function fetchData() {
      showLoading(true);
      try {
        const response = await fetch(GAS_URL + '?action=getData');
        const text = await response.text(); // Ambil teks mentah dulu
        
        let data;
        try {
          data = JSON.parse(text);
              chartData = data; 
    dataTerakhir = data; 
        } catch (e) {
          throw new Error("Format data dari GAS salah/error. Cek URL Deployment Anda.");
        }
        
        updateSummary(data); 
        renderRekap(data.rekapHariIni);
        setTimeout(() => {
          try {
            drawCharts(data);
          } catch (chartError) {
            console.error("Grafik gagal:", chartError);
            // Tetap lanjut meskipun grafik gagal agar saldo tidak hilang
          }
        }, 100);

      } catch (error) {
        console.error('Fatal Error:', error);
        showSystemError(error.message);
      } finally {
        showLoading(false);
      }
    }

    function updateSummary(data) {
      if (!data) return;
      // Gunakan innerText untuk keamanan
      const elBulan = document.getElementById('totalBulanIni');
      const elHari = document.getElementById('totalHariIni');
      const elNamaBulan = document.getElementById('namaBulan');
      const elNamaBulan2 = document.getElementById('namaBulan2');
      const elNamaBulanGrafik = document.getElementById('namaBulanGrafik'); // Tambahan
      
      if (elBulan) elBulan.innerText = 'Rp. ' + (data.totalBulanIni || 0).toLocaleString('id-ID');
      if (elHari) elHari.innerText = 'Rp. ' + (data.totalHariIni || 0).toLocaleString('id-ID');
      
      const skrg = new Date();
      const formatBulan = skrg.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
      if (elNamaBulan) elNamaBulan.innerText = skrg.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
      if (elNamaBulan2) elNamaBulan2.innerText = skrg.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
      if (elNamaBulanGrafik) elNamaBulanGrafik.innerText = "Bulan " + formatBulan; // Set label grafik
    }

        function renderRekap(rekap) {
      const container = document.getElementById('rekapHariIni');
      if (!container) return;
      if(!rekap || rekap.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-400 text-sm py-4">Tidak ada transaksi hari ini</p>';
        return;
      }
      container.innerHTML = rekap.map(item => `
        <div class="flex items-start justify-between pb-4 mt-4">
          <div>
            <p class="font-normal text-gray-900 leading-tight">${item.kategori} ${item.items}</p>
            <p class="hidden text-xs text-gray-500">${item.items}</p>
          </div>
          <p class="font-normal text-grey-900 text-right w-1/3">Rp. ${item.nominal.toLocaleString('id-ID')}</p>
        </div>
      `).join('');
    }
      
    function updatePieChart(labels, values, color) {
      const canvas = document.getElementById('pieChart');
      if (!canvas) return;
      
      if (window.currentPieChart) window.currentPieChart.destroy();

  // Jika data kosong, jangan render grafik
  if (!labels || labels.length === 0) {
    console.log("Data Pie Chart kosong");
    return;
  }

  window.currentPieChart = new Chart(canvas.getContext('2d'), {
        type: 'doughnut',
        data: {
          labels: labels || [],
          datasets: [{
            data: values || [],
            backgroundColor: [color, '#FB923C', '#FBBF24', '#34D399', '#60A5FA', '#A78BFA'],
            borderWidth: 1,
            borderColor: '#fff'
          }]
        },
        options: {
          cutout: '70%',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { usePointStyle: true, pointStyle: 'rectRounded', padding: 10, font: { size: 12 } } }
          },
    // For padding between the chart area and the whole legend/title
    layout: {
      padding: {
        bottom: 30 // Add padding to the layout itself
      }
    }
  }
      });
    }

    function switchTab(type) {
      if (!chartData) return;
      
      const btnKeluar = document.getElementById('tabPengeluaran');
      const btnMasuk = document.getElementById('tabPemasukan');
      
      if (type === 'pengeluaran') {
        btnKeluar.className = "flex w-32 text-sm text-gray-600 font-bold bg-white border-2 border-gray-300 transition-all rounded-lg py-1 justify-center";
        btnMasuk.className = "flex w-32 text-sm text-gray-400 font-bold bg-gray-300 border-2 border-gray-300 rounded-lg transition-all py-1 justify-center";
        
        updatePieChart(chartData.kategoriLabels, chartData.kategoriValues, '#F43F5E');
      } else {
        btnKeluar.className = "flex w-32 text-sm text-gray-400 font-bold bg-gray-300 border-2 border-gray-300 rounded-lg transition-all py-1 justify-center";
        btnMasuk.className = "flex text-sm text-gray-600 font-bold border-gray-300 border-2 transition-all bg-white rounded-lg py-1 w-32 justify-center";
        updatePieChart(chartData.pemasukanLabels, chartData.pemasukanValues, '#0284C7');
      }
    }

    function drawCharts(data) {
      updatePieChart(data.kategoriLabels, data.kategoriValues, '#F43F5E');

      const canvasBar = document.getElementById('barChart');
      if (!canvasBar) return;
      
      if (currentBarChart) currentBarChart.destroy();

      currentBarChart = new Chart(canvasBar.getContext('2d'), {
        type: 'bar',
        data: {
          labels: (data.itemLabels || []).map((item, index) => [data.itemKategori[index] || '', item]),
          datasets: [{
            label: 'Nominal',
            data: data.itemValues || [],
            backgroundColor: 'rgba(16, 185, 129, 1)',
            borderRadius: 3,
            barThickness: 16
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { 
          display: true,
          grid: { display: false },
          ticks: {
            font: { size: 10 },
            callback: function(value) {
              return value.toLocaleString('id-ID');
            }
          }
        },
            y: {
              grid: { display: false },
              ticks: { padding: 10, font: { size: 10, weight: '400', lineHeight: 1.25 } }
            }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

      // Fungsi untuk menampilkan/menyembunyikan list
function toggleListPengeluaran() {
  const container = document.getElementById('listPengeluaranDetail');
  if (container.classList.contains('hidden')) {
    renderListPengeluaran(); // Isi data dulu sebelum ditampilkan
    container.classList.remove('hidden');
  } else {
    container.classList.add('hidden');
  }
}

// Fungsi untuk merender list pengeluaran tanpa card
function renderListPengeluaran() {
  const container = document.getElementById('listPengeluaranDetail');
  const data = dataTerakhir; 

  if (!data || !data.listPengeluaran) return;

  // Urutkan berdasarkan tanggal terbaru (descending)
  const sortedList = [...data.listPengeluaran].reverse();

  let htmlContent = "";
  sortedList.forEach(item => {
    htmlContent += `
      <div class="flex justify-between items-center py-2 border-b border-gray-50 last:border-0">
        <div class="flex flex-col">
          <span class="text-[11px] font-bold text-gray-800">${item.Item}</span>
          <span class="text-[9px] text-gray-400">${item.Tanggal} • ${item.Kategori}</span>
        </div>
        <div class="text-[11px] font-bold text-rose-600">
          Rp ${item.Nominal.toLocaleString('id-ID')}
        </div>
      </div>`;
  });

  if (sortedList.length === 0) {
    htmlContent = `<p class="text-[10px] text-gray-400 text-center py-4 italic">Belum ada pengeluaran bulan ini</p>`;
  }

  container.innerHTML = htmlContent;
}
      
    function showLoading(show) {
      const l = document.getElementById('loading');
      const m = document.getElementById('mainContent');
      if (l) l.style.display = show ? 'flex' : 'none';
      if (m) m.style.display = show ? 'none' : 'block';
    }

    function showSystemError(msg) {
      const errorDiv = document.createElement('div');
      errorDiv.className = "bg-red-600 text-white p-4 rounded-xl m-4 text-xs font-mono fixed top-0 left-0 right-0 z-[9999]";
      errorDiv.innerHTML = "<b>Sistem Error:</b> " + msg;
      document.body.prepend(errorDiv);
    }

    fetchData();

      // Simpan data global untuk diakses halaman rekap
let dataGlobal = null;

// Fungsi untuk membuka halaman rekap
function bukaHalamanRekap() {
  const hal = document.getElementById('halamanRekap');
  hal.classList.remove('hidden');
  setTimeout(() => {
    hal.classList.remove('translate-x-full'); // Animasi geser masuk
  }, 10);
  
  renderRekapDetail();
}

// Fungsi untuk menutup halaman rekap
function tutupHalamanRekap() {
  const hal = document.getElementById('halamanRekap');
  hal.classList.add('translate-x-full');
  setTimeout(() => {
    hal.classList.add('hidden');
  }, 300);
}

// Menampilkan list rekapan seperti screenshot
function renderRekapDetail() {
  const container = document.getElementById('isiRekapDetail');
  const data = dataTerakhir; 

  if (!data) return;

  const skrg = new Date();
  const namaBulan = skrg.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
  let htmlContent = "";

  // --- A. BAGIAN PEMASUKAN ---
  htmlContent += `<h3 class="text-gray-700 font-bold text-sm mb-3 mt-2 titlecase">Pemasukan Bulan ${namaBulan}</h3>`;
  
  let totalMasuk = 0;
  if (data.pemasukanLabels && data.pemasukanLabels.length > 0) {
    data.pemasukanLabels.forEach((label, index) => {
      const nominal = data.pemasukanValues[index];
      totalMasuk += nominal;
      htmlContent += `
        <div class="flex justify-between items-center mb-1 text-sm border-b border-gray-100 pb-1">
          <span class="text-gray-700">${label}</span>
          <span class="font-medium text-gray-900 text-right">Rp. ${nominal.toLocaleString('id-ID')}</span>
        </div>`;
    });
    htmlContent += `
      <div class="flex justify-between items-center mt-2 pt-2 border-t-2 border-gray-500 font-bold text-emerald-700 mb-8">
        <span>Total Pemasukan</span>
        <span>Rp. ${totalMasuk.toLocaleString('id-ID')}</span>
      </div>`;
  } else {
    htmlContent += `<p class="text-xs text-gray-400 italic">Tidak ada data pemasukan</p>`;
  }

  // --- B. BAGIAN PENGELUARAN ---
  htmlContent += `<h3 class="text-gray-700 font-bold text-sm mb-3 mt-8 titlecase">Pengeluaran Bulan ${namaBulan}</h3>`;
  
  let totalKeluar = 0;
  if (data.kategoriLabels && data.kategoriLabels.length > 0) {
    data.kategoriLabels.forEach((label, index) => {
      const nominal = data.kategoriValues[index];
      totalKeluar += nominal;
      htmlContent += `
        <div class="flex justify-between items-center mb-1 text-sm border-b border-gray-100 pb-1">
          <span class="text-gray-700">${label}</span>
          <span class="font-medium text-gray-900 text-right">Rp. ${nominal.toLocaleString('id-ID')}</span>
        </div>`;
    });
    htmlContent += `
      <div class="flex justify-between items-center mt-2 pt-2 border-t-2 border-rose-600 font-bold text-rose-700">
        <span>Total Pengeluaran</span>
        <span>Rp. ${totalKeluar.toLocaleString('id-ID')}</span>
      </div>`;
  } else {
    htmlContent += `<p class="text-xs text-gray-400 italic">Tidak ada data pengeluaran</p>`;
  }

  container.innerHTML = htmlContent;
}
</script>
</body>
</html>
