<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gradient-to-b from-sky-800 from-[20%] to-neutral-200 to-[20%] p-4 font-sans text-gray-800">
  <div class="max-w-md mx-auto">

        <!-- Total Pengeluaran Bulan Ini -->
    <div class="text-white mb-5">
      <p class="text-xs font-normal uppercase tracking-widest mb-1 opacity-90 text-center">Total Pengeluaran Bulan Ini</p>
      <h1 id="totalBulanIni" class="text-4xl font-bold leading-none text-center">Rp. 0</h1>
      <p id="namaBulan" class="text-sm mt-2 opacity-80 text-center">Loading...</p>
    </div>

    <!-- Rekap Harian Hari Ini -->
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-white mb-5">
      <h3 class="text-xl font-bold mb-3 flex items-center">
        <span class="w-2 h-4 bg-red-500 rounded-full mr-2 hidden"></span> Pengeluaran Hari Ini
      </h3>
        <span id="totalHariIni" class="text-2xl font-bold text-red-500 mb-2">Rp. 0</span>
      <div id="rekapHariIni" class="-space-y-2">
        <p class="text-gray-400 text-sm">Memuat data...</p>
      </div>
 <!--     <div class="mt-2 pt-2 border-t border-gray-100">
        <div class="flex justify-between items-center">
          <span class="text-base font-semibold text-gray-600">Total Hari Ini:</span>
          <span id="totalHariIni" class="text-lg font-bold text-red-500">Rp. 0</span>
        </div>
      </div>-->
    </div>

    <!-- Grafik Doughnut - Kategori 
    <div class="bg-white rounded-3xl p-5 border-white mb-5">
      <p class="text-xs font-light uppercase tracking-widest mb-1 text-left">Statistik</p>
      <h3 class="text-xl font-bold mb-6 flex items-center">
        <span class="w-2 h-4 bg-amber-500 rounded-full mr-2 hidden"></span> Kategori Pengeluaran
      </h3>
      <div class="aspect-square">
        <canvas id="pieChart"></canvas>

    </div>-->
    <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 mb-5">
  <div class="flex border-b border-gray-100 mb-6">
    <button id="tabPengeluaran" onclick="switchTab('pengeluaran')" class="flex-1 pb-3 text-sm font-bold border-b-2 border-rose-600 text-rose-600 transition-all">
      Pengeluaran
    </button>
    <button id="tabPemasukan" onclick="switchTab('pemasukan')" class="flex-1 pb-3 text-sm font-bold border-b-2 border-transparent text-gray-400 transition-all">
      Pemasukan
    </button>
  </div>
  
  <div class="aspect-square relative">
    <canvas id="pieChart"></canvas>
  </div>
</div>

    <!-- Grafik Bar - 7 Hari Terakhir per Item -->
    <div class="bg-white rounded-3xl p-5 border border-white">
      <h3 class="text-xl font-bold mb-2 flex items-center">
        <span class="w-2 h-4 bg-sky-600 rounded-full mr-2 hidden"></span> Pengeluaran Terbanyak
      </h3>
      <h3 class="text-base font-medium mb-4 flex items-center text-gray-500">
        <span class="w-2 h-4 bg-sky-600 rounded-full mr-2 hidden"></span> 7 hari terakhir
      </h3>
      <div class="relative aspect-[4/3] w-full">
        <canvas id="barChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    // Inisialisasi Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // URL Google Apps Script Web App Anda
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbym_nljEPd8FkHu9xwBAV2DXTU4H7qR4WtDpm8IdwqFatBQ25DH2nGgRvluzjQHeADXdA/exec';
    let chartData = null;
    let currentPieChart = null;
    
    window.onload = function() {
      fetchData();
    };

    async function fetchData() {
      try {
        const response = await fetch(GAS_URL + '?action=getData');
        const data = await response.json();
        drawCharts(data);
      } catch (error) {
        console.error('Error fetching data:', error);
        tg.showAlert('Gagal memuat data');
      }
    }

  function switchTab(type) {
  const btnKeluar = document.getElementById('tabPengeluaran');
  const btnMasuk = document.getElementById('tabPemasukan');
  
  if (type === 'pengeluaran') {
    btnKeluar.className = "flex-1 pb-3 text-sm font-bold border-b-2 border-rose-600 text-rose-600";
    btnMasuk.className = "flex-1 pb-3 text-sm font-bold border-b-2 border-transparent text-gray-400";
    updatePieChart(chartData.kategoriLabels, chartData.kategoriValues, '#F43F5E'); // Warna merah
  } else {
    btnKeluar.className = "flex-1 pb-3 text-sm font-bold border-b-2 border-transparent text-gray-400";
    btnMasuk.className = "flex-1 pb-3 text-sm font-bold border-b-2 border-sky-600 text-sky-600";
    // Pastikan GAS mengirim data kategoriPemasukanLabels dan kategoriPemasukanValues
    updatePieChart(chartData.pemasukanLabels || [], chartData.pemasukanValues || [], '#0284C7'); // Warna biru
  }
}
   function updatePieChart(labels, values, themeColor) {
  if (currentPieChart) currentPieChart.destroy();
  
  const ctx = document.getElementById('pieChart').getContext('2d');
  currentPieChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: labels,
      datasets: [{
        data: values,
        backgroundColor: [themeColor, '#FB923C', '#FBBF24', '#34D399', '#60A5FA', '#A78BFA'],
        borderWidth: 3,
        borderColor: '#fff'
      }]
    },
    options: {
      cutout: '65%',
      plugins: {
        legend: { position: 'bottom', labels: { usePointStyle: true, padding: 15, font: { size: 11 } } }
      }
    }
  });
}
    
    function drawCharts(data) {
      const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      const currentMonth = new Date().getMonth();
      
      // Total Bulan Ini
      document.getElementById('totalBulanIni').innerText = "Rp. " + data.totalBulanIni.toLocaleString('id-ID');
      document.getElementById('namaBulan').innerText = monthNames[currentMonth] + ' ' + new Date().getFullYear();

      // Rekap Harian Hari Ini
      const rekapContainer = document.getElementById('rekapHariIni');
      if (data.rekapHariIni && data.rekapHariIni.length > 0) {
        rekapContainer.innerHTML = data.rekapHariIni.map(item => `
          <div class="flex justify-between items-center py-2 border-b border-gray-50">
            <div>
              <p class="font-semibold text-sm text-gray-800 capitalize">${item.kategori}</p>
              <p class="text-xs text-gray-500">${item.items}</p>
            </div>
            <span class="font-medium text-red-500">Rp. ${item.nominal.toLocaleString('id-ID')}</span>
          </div>
        `).join('');
      } else {
        rekapContainer.innerHTML = '<p class="text-gray-400 text-sm">Belum ada pengeluaran hari ini</p>';
      }
      document.getElementById('totalHariIni').innerText = "Rp. " + data.totalHariIni.toLocaleString('id-ID');

      // Pie Chart - Kategori
      new Chart(document.getElementById('pieChart'), {
        type: 'doughnut',
        data: {
          labels: data.kategoriLabels,
          datasets: [{
            data: data.kategoriValues,
            backgroundColor: ['#0EA5E9', '#F472B6', '#60A5FA', '#FBBF24', '#34D399', '#A78BFA', '#F87171', '#10B981', '#8B5CF6'],
            borderWidth: 3,
            borderColor: '#fff',
            hoverOffset: 15
          }]
        },
        options: { 
          plugins: { 
            legend: { 
              position: 'bottom', 
              labels: { 
                usePointStyle: true, 
                padding: 15,
                font: { size: 11 }
              } 
            } 
          },
          cutout: '65%'
        }
      });

// Bar Chart - Top 5 Pengeluaran Bertumpuk
      new Chart(document.getElementById('barChart'), {
        type: 'bar',
        data: {
          labels: data.itemLabels.map((item, index) => {
            const kat = data.itemKategori ? data.itemKategori[index] : '';
            return [kat, item]; // Membuat label bertumpuk
          }),
          datasets: [{
            label: 'Pengeluaran',
            data: data.itemValues,
            backgroundColor: 'rgba(16, 185, 129, 1)',
            borderColor: '#16a34a',
            borderWidth: 1,
            borderRadius: 3,
            barThickness: 16
          }]
        },
        options: { 
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          scales: { 
            x: { 
              beginAtZero: true,
              ticks: {
                callback: function(value) { return 'Rp. ' + value.toLocaleString('id-ID'); },
                font: { size: 10 }
              }
            },
            y: { 
              grid: { display: false },
              ticks: {
                autoSkip: false,
                font: { size: 10, weight: '400' },
                padding: 5,
                lineHeight: 0.8
              }
            }
          },
          plugins: { legend: { display: false } }
        }
      });
    }
  </script>
</body>
</html>
