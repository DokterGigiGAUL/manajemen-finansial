<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-50 p-4 font-sans text-gray-800">
  <div class="max-w-md mx-auto">
    <!-- Total Pengeluaran Bulan Ini -->
    <div class="bg-gradient-to-br from-cyan-700 to-sky-800 rounded-3xl p-6 shadow-lg mb-5 text-white">
      <p class="text-xs font-bold uppercase tracking-widest mb-1 opacity-90">Total Pengeluaran Bulan Ini</p>
      <h1 id="totalBulanIni" class="text-4xl font-extrabold leading-none">IDR 0</h1>
      <p id="namaBulan" class="text-sm mt-2 opacity-80">Loading...</p>
    </div>

    <!-- Rekap Harian Hari Ini -->
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 mb-5">
      <h3 class="text-sm font-bold mb-3 flex items-center">
        <span class="w-2 h-4 bg-rose-600 rounded-full mr-2"></span> Pengeluaran Hari Ini
      </h3>
      <div id="rekapHariIni" class="space-y-2">
        <p class="text-gray-400 text-sm">Memuat data...</p>
      </div>
      <div class="mt-4 pt-4 border-t border-gray-100">
        <div class="flex justify-between items-center">
          <span class="text-sm font-semibold text-gray-600">Total Hari Ini:</span>
          <span id="totalHariIni" class="text-xl font-bold text-red-500">IDR 0</span>
        </div>
      </div>
    </div>

    <!-- Grafik Doughnut - Kategori -->
    <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 mb-5">
      <h3 class="text-sm font-bold mb-4 flex items-center">
        <span class="w-2 h-4 bg-blue-500 rounded-full mr-2"></span> Kategori Belanja Bulan Ini
      </h3>
      <div class="aspect-square">
        <canvas id="pieChart"></canvas>
      </div>
    </div>

    <!-- Grafik Bar - 7 Hari Terakhir per Item -->
    <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
      <h3 class="text-sm font-bold mb-4 flex items-center">
        <span class="w-2 h-4 bg-sky-600 rounded-full mr-2"></span> Top 10 Item - 7 Hari Terakhir
      </h3>
      <canvas id="barChart"></canvas>
    </div>
  </div>

  <script>
    // Inisialisasi Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // URL Google Apps Script Web App Anda
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzyifraxaKPVJLtzKpwXIRSGevU4zhcF0x0_FKIjpC_Sj3OQe6eRRNl7PMbaugeK6M7kA/exec';

    window.onload = function() {
      fetchData();
    };

    async function fetchData() {
      try {
        const response = await fetch(GAS_URL + '?action=getData');
        const data = await response.json();
        drawCharts(data);
      } catch (error) {
        console.error('Error fetching data:', error);
        tg.showAlert('Gagal memuat data');
      }
    }

    function drawCharts(data) {
      const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      const currentMonth = new Date().getMonth();
      
      // Total Bulan Ini
      document.getElementById('totalBulanIni').innerText = "IDR " + data.totalBulanIni.toLocaleString('id-ID');
      document.getElementById('namaBulan').innerText = monthNames[currentMonth] + ' ' + new Date().getFullYear();

      // Rekap Harian Hari Ini
      const rekapContainer = document.getElementById('rekapHariIni');
      if (data.rekapHariIni && data.rekapHariIni.length > 0) {
        rekapContainer.innerHTML = data.rekapHariIni.map(item => `
          <div class="flex justify-between items-center py-2 border-b border-gray-50">
            <div>
              <p class="font-semibold text-sm text-gray-800">${item.kategori}</p>
              <p class="text-xs text-gray-500">${item.items}</p>
            </div>
            <span class="font-bold text-red-500">IDR ${item.nominal.toLocaleString('id-ID')}</span>
          </div>
        `).join('');
      } else {
        rekapContainer.innerHTML = '<p class="text-gray-400 text-sm">Belum ada pengeluaran hari ini</p>';
      }
      document.getElementById('totalHariIni').innerText = "IDR " + data.totalHariIni.toLocaleString('id-ID');

      // Pie Chart - Kategori
      new Chart(document.getElementById('pieChart'), {
        type: 'doughnut',
        data: {
          labels: data.kategoriLabels,
          datasets: [{
            data: data.kategoriValues,
            backgroundColor: ['#F472B6', '#60A5FA', '#FBBF24', '#34D399', '#A78BFA', '#F87171', '#10B981', '#8B5CF6'],
            borderWidth: 3,
            borderColor: '#fff',
            hoverOffset: 15
          }]
        },
        options: { 
          plugins: { 
            legend: { 
              position: 'bottom', 
              labels: { 
                usePointStyle: true, 
                padding: 15,
                font: { size: 11 }
              } 
            } 
          },
          cutout: '65%'
        }
      });

      // Bar Chart - 7 Hari Terakhir per Item
      new Chart(document.getElementById('barChart'), {
        type: 'bar',
        data: {
          labels: data.itemLabels,
          datasets: [{
            label: 'Pengeluaran',
            data: data.itemValues,
            backgroundColor: 'rgba(2, 132, 199, 0.8)',
            borderColor: '#0EA5E9',
            borderWidth: 2,
            borderRadius: 8,
            barThickness: 25
          }]
        },
        options: { 
          indexAxis: 'y',
          scales: { 
            x: { 
              beginAtZero: true,
              grid: { display: true, color: '#f3f4f6' },
              ticks: {
                callback: function(value) {
                  return 'IDR ' + value.toLocaleString('id-ID');
                },
                font: { size: 10 }
              }
            },
            y: { 
              grid: { display: false },
              ticks: {
                font: { size: 10 }
              }
            }
          },
          plugins: {
            legend: { display: false }
          }
        }
      });
    }
  </script>
</body>
</html>
