<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gradient-to-b from-zinc-100 from-[20%] to-gray-100 to-[20%] p-6 font-[Helvetica] font-sans text-gray-800">
  <div class="max-w-md mx-auto">
    <div class="p-4 mb-4 text-black font-sans">
      <p class="text-xs font-semibold uppercase tracking-widest mb-1 opacity-90 text-center">Total Pengeluaran Bulan Ini</p>
      <h1 id="totalBulanIni" class="text-4xl font-bold leading-none text-center">Rp. 0</h1>
      <p id="namaBulan" class="text-sm mt-2 opacity-80 text-center">Loading...</p>
    </div>

    <!-- Rekap Harian Hari Ini -->
    <div class="bg-white rounded-3xl p-4 mb-6">
      <h3 class="text-lg font-bold mb-1 flex items-center">
        <span class="w-2 h-4 bg-red-500 rounded-full mr-2 hidden"></span> Pengeluaran Hari Ini
      </h3>
        <span id="totalHariIni" class="text-xl font-semibold text-red-500 mb-1">Rp. 0</span>
      <div id="rekapHariIni" class="-space-y-2">
        <p class="text-gray-400 text-sm mt-2">Memuat data...</p>
      </div>
    </div>

        <!-- Grafik Rekap Bulanan -->
    <div class="bg-white rounded-3xl p-4 mb-6">
      <h3 class="text-lg font-bold mb-3 flex items-center">Rekapitulasi Bulanan</h3>
      <p id="namaBulan2" class="text-sm mt-1 mb-3 opacity-90 text-center text-grey-400"></p>
  <div class="flex bg-gray-300 border-gray-300 border-1 mb-8 rounded-lg w-64 mx-auto">
    <button id="tabPengeluaran" onclick="switchTab('pengeluaran')" class="flex text-sm text-gray-600 font-semibold border-gray-300 border-2 transition-all bg-white rounded-lg py-1 w-32 justify-center"> 
      Pengeluaran
    </button>
    <button id="tabPemasukan" onclick="switchTab('pemasukan')" class="flex w-32 text-sm text-gray-400 font-semibold bg-gray-300 border-2 border-gray-300 rounded-lg transition-all py-1 justify-center">
      Pemasukan
    </button>
  </div>
  
    <div class="aspect-square relative w-full">
      <canvas id="pieChart"></canvas>
    </div>
    </div>

    <!-- Grafik Bar - Pengeluaran Terbanyak 30 Hari -->
    <div class="bg-white rounded-3xl p-4 border border-white">
      <h3 class="text-lg font-bold mb-1 flex items-center">Pengeluaran Terbanyak</h3>
      <h3 id="namaBulanGrafik" class="text-base font-medium mb-2 flex items-center text-gray-500">
      </h3>

      <div class="relative aspect-[5/4] w-full mb-4">
        <canvas id="barChart"></canvas>
      </div>
    </div>
  </div>

    <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbym_nljEPd8FkHu9xwBAV2DXTU4H7qR4WtDpm8IdwqFatBQ25DH2nGgRvluzjQHeADXdA/exec"; 
    const tg = window.Telegram.WebApp;
    tg.expand();

    let chartData = null; 
    let currentPieChart = null;
    let currentBarChart = null; // Tambahkan ini untuk tracking bar chart

    async function fetchData() {
      showLoading(true);
      try {
        const response = await fetch(GAS_URL + '?action=getData');
        const text = await response.text(); // Ambil teks mentah dulu
        
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error("Format data dari GAS salah/error. Cek URL Deployment Anda.");
        }
        
        chartData = data; 

        updateSummary(data); 
        renderRekap(data.rekapHariIni);
        setTimeout(() => {
          try {
            drawCharts(data);
          } catch (chartError) {
            console.error("Grafik gagal:", chartError);
            // Tetap lanjut meskipun grafik gagal agar saldo tidak hilang
          }
        }, 100);

      } catch (error) {
        console.error('Fatal Error:', error);
        showSystemError(error.message);
      } finally {
        showLoading(false);
      }
    }

    function updateSummary(data) {
      if (!data) return;
      // Gunakan innerText untuk keamanan
      const elBulan = document.getElementById('totalBulanIni');
      const elHari = document.getElementById('totalHariIni');
      const elNamaBulan = document.getElementById('namaBulan');
      const elNamaBulan2 = document.getElementById('namaBulan2');
      const elNamaBulanGrafik = document.getElementById('namaBulanGrafik'); // Tambahan
      
      if (elBulan) elBulan.innerText = 'Rp. ' + (data.totalBulanIni || 0).toLocaleString('id-ID');
      if (elHari) elHari.innerText = 'Rp. ' + (data.totalHariIni || 0).toLocaleString('id-ID');
      
      const skrg = new Date();
      const formatBulan = skrg.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
      if (elNamaBulan) elNamaBulan.innerText = skrg.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
      if (elNamaBulan2) elNamaBulan2.innerText = skrg.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
      if (elNamaBulanGrafik) elNamaBulanGrafik.innerText = "Bulan " + formatBulan; // Set label grafik
    }

        function renderRekap(rekap) {
      const container = document.getElementById('rekapHariIni');
      if (!container) return;
      if(!rekap || rekap.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-400 text-sm py-4">Tidak ada transaksi hari ini</p>';
        return;
      }
      container.innerHTML = rekap.map(item => `
        <div class="flex items-start justify-between pb-4 mt-4">
          <div>
            <p class="font-normal text-gray-900 leading-tight">${item.kategori} ${item.items}</p>
            <p class="hidden text-xs text-gray-500">${item.items}</p>
          </div>
          <p class="font-normal text-grey-900 text-right w-1/3">Rp. ${item.nominal.toLocaleString('id-ID')}</p>
        </div>
      `).join('');
    }
      
    function updatePieChart(labels, values, color) {
      const canvas = document.getElementById('pieChart');
      if (!canvas) return;
      
      if (currentPieChart) currentPieChart.destroy();
      
      currentPieChart = new Chart(canvas.getContext('2d'), {
        type: 'doughnut',
        data: {
          labels: labels || [],
          datasets: [{
            data: values || [],
            backgroundColor: [color, '#FB923C', '#FBBF24', '#34D399', '#60A5FA', '#A78BFA'],
            borderWidth: 1,
            borderColor: '#fff'
          }]
        },
        options: {
          cutout: '70%',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { usePointStyle: true, pointStyle: 'rectRounded', padding: 10, font: { size: 12 } } }
          }
        }
      });
    }

    function switchTab(type) {
      if (!chartData) return;
      
      const btnKeluar = document.getElementById('tabPengeluaran');
      const btnMasuk = document.getElementById('tabPemasukan');
      
      if (type === 'pengeluaran') {
        btnKeluar.className = "flex w-32 text-sm text-gray-600 font-bold bg-white border-2 border-gray-300 transition-all rounded-lg py-1 justify-center";
        btnMasuk.className = "flex w-32 text-sm text-gray-400 font-bold bg-gray-300 border-2 border-gray-300 rounded-lg transition-all py-1 justify-center";
        
        updatePieChart(chartData.kategoriLabels, chartData.kategoriValues, '#F43F5E');
      } else {
        btnKeluar.className = "flex w-32 text-sm text-gray-400 font-bold bg-gray-300 border-2 border-gray-300 rounded-lg transition-all py-1 justify-center";
        btnMasuk.className = "flex text-sm text-gray-600 font-bold border-gray-300 border-2 transition-all bg-white rounded-lg py-1 w-32 justify-center";
        updatePieChart(chartData.pemasukanLabels, chartData.pemasukanValues, '#0284C7');
      }
    }

    function drawCharts(data) {
      updatePieChart(data.kategoriLabels, data.kategoriValues, '#F43F5E');

      const canvasBar = document.getElementById('barChart');
      if (!canvasBar) return;
      
      if (currentBarChart) currentBarChart.destroy();

      currentBarChart = new Chart(canvasBar.getContext('2d'), {
        type: 'bar',
        data: {
          labels: (data.itemLabels || []).map((item, index) => [data.itemKategori[index] || '', item]),
          datasets: [{
            label: 'Nominal',
            data: data.itemValues || [],
            backgroundColor: 'rgba(16, 185, 129, 1)',
            borderRadius: 3,
            barThickness: 16
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { 
          display: true,
          grid: { display: false },
          ticks: {
            font: { size: 10 },
            callback: function(value) {
              return value.toLocaleString('id-ID');
            }
          }
        },
            y: {
              grid: { display: false },
              ticks: { padding: 10, font: { size: 10, weight: '400', lineHeight: 1.25 } }
            }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    function showLoading(show) {
      const l = document.getElementById('loading');
      const m = document.getElementById('mainContent');
      if (l) l.style.display = show ? 'flex' : 'none';
      if (m) m.style.display = show ? 'none' : 'block';
    }

    function showSystemError(msg) {
      const errorDiv = document.createElement('div');
      errorDiv.className = "bg-red-600 text-white p-4 rounded-xl m-4 text-xs font-mono fixed top-0 left-0 right-0 z-[9999]";
      errorDiv.innerHTML = "<b>Sistem Error:</b> " + msg;
      document.body.prepend(errorDiv);
    }

    fetchData();
</script>
</body>
</html>
