<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
  
<body class="bg-gradient-to-b from-sky-800 from-[20%] to-neutral-200 to-[20%] p-4 font-sans text-gray-800">
  <div class="max-w-md mx-auto"> 
    
    <div class="mb-5 text-white"> 
      <p class="text-xs font-bold uppercase tracking-widest mb-2 opacity-90 text-center">Total Pengeluaran Bulan Ini</p>
      <h1 id="totalBulanIni" class="text-4xl font-bold leading-none text-center">Rp. 0</h1>
      <p id="namaBulan" class="text-sm mt-2 opacity-80 text-center">Loading...</p>
    </div>

    <!-- Rekap Harian Hari Ini -->
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-white mb-5"> 
      <h3 class="text-xl font-bold mb-1 flex items-center"><span class="w-2 h-4 bg-red-500 rounded-full mr-2 hidden"></span> Pengeluaran Hari Ini</h3>
      <span id="totalHariIni" class="text-2xl font-bold text-rose-600 mb-2">Rp. 0</span>
      <div id="rekapHariIni" class="-space-y-2">
        <p class="text-gray-400 text-sm">Memuat data...</p>
      </div>
    </div> 
    
    <!-- Monthly Breakdown -->
    <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 mb-5"> 
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-gray-800">Monthly Breakdown</h3>
        <div class="flex space-x-2">
          <button onclick="changeMonth(-1)" class="p-1.5 bg-gray-100 rounded-full hover:bg-gray-200 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
          </button>
          <button onclick="changeMonth(1)" class="p-1.5 bg-gray-100 rounded-full hover:bg-gray-200 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
          </button>
        </div> 
      </div> 
      
      <div class="space-y-3"> 
        <!-- Breakout Bar Pemasukan -->
        <div> 
          <div class="flex justify-between text-xs mb-1">
            <span class="text-green-600 font-semibold">Pemasukan</span>
            <span id="breakdownInText" class="font-normal">Rp. 0</span>
          </div> 
          <div class="w-full bg-gray-100 rounded-full h-2"> 
            <div id="breakdownInBar" class="bg-sky-500 h-2 rounded-full transition-all duration-500" style="width: 0%"> //progress
            </div> 
          </div> 
        </div> 
        <!-- Breakout Bar Pengeluaran-->
        <div> 
          <div class="flex justify-between text-xs mb-1"> 
            <span class="text-rose-600 font-semibold">Pengeluaran</span>
            <span id="breakdownOutText" class="font-normal">Rp. 0</span>
          </div> 
          <div class="w-full bg-gray-100 rounded-full h-2"> 
            <div id="breakdownOutBar" class="bg-rose-500 h-2 rounded-full transition-all duration-500" style="width: 0%"> //progress
            </div> 
          </div> 
        </div> 
        <p id="monthLabel" class="text-center text-[10px] text-gray-400 mt-4 font-medium uppercase tracking-widest">Januari 2026</p>
      </div>
    </div>
    
    <!-- Grafik Doughnut - Kategori 
    <div class="bg-white rounded-3xl p-5 border-white mb-5">
      <p class="text-xs font-light uppercase tracking-widest mb-1 text-left">Statistik</p>
      <h3 class="text-xl font-bold mb-6 flex items-center">
        <span class="w-2 h-4 bg-amber-500 rounded-full mr-2 hidden"></span> Kategori Pengeluaran
      </h3>
      <div class="aspect-square">
        <canvas id="pieChart"></canvas>
      </div>
    </div>-->
    <div class="bg-white rounded-3xl p-5 mb-5">
  <div class="flex border-b border-gray-100 mb-6">
    <button id="tabPengeluaran" onclick="switchTab('pengeluaran')" class="flex-1 pb-3 text-lg font-bold border-b-2 border-rose-600 text-rose-600 transition-all">
      Pengeluaran
    </button>
    <button id="tabPemasukan" onclick="switchTab('pemasukan')" class="flex-1 pb-3 text-lg font-bold border-b-2 border-transparent text-gray-400 transition-all">
      Pemasukan
    </button>
  </div>
  
  <div class="aspect-square relative">
    <canvas id="pieChart"></canvas>
  </div>
</div>

    <!-- Grafik Bar - 7 Hari Terakhir per Item -->
    <div class="bg-white rounded-3xl p-5 border border-white">
      <h3 class="text-xl font-bold mb-2 flex items-center">
        <span class="w-2 h-4 bg-sky-600 rounded-full mr-2 hidden"></span> Pengeluaran Terbanyak
      </h3>
      <h3 class="text-base font-medium mb-4 flex items-center text-gray-500">
        <span class="w-2 h-4 bg-sky-600 rounded-full mr-2 hidden"></span> 7 hari terakhir
      </h3>
      <div class="relative aspect-[4/3] w-full">
        <canvas id="barChart"></canvas>
      </div>
    </div>
  </div>

    <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbym_nljEPd8FkHu9xwBAV2DXTU4H7qR4WtDpm8IdwqFatBQ25DH2nGgRvluzjQHeADXdA/exec"; 
    const tg = window.Telegram.WebApp;
    tg.expand();

    let chartData = null; 
    let currentPieChart = null;
    let currentBarChart = null; // Tambahkan ini untuk tracking bar chart

    async function fetchData() {
      showLoading(true);
      try {
        const response = await fetch(GAS_URL + '?action=getData');
        const text = await response.text(); // Ambil teks mentah dulu
        
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error("Format data dari GAS salah/error. Cek URL Deployment Anda.");
        }
        
        chartData = data; 

        // TAMPILKAN SALDO DULU (Prioritas Utama)
        updateSummary(data); 
        
        // TAMPILKAN REKAP LIST
        renderRekap(data.rekapHariIni);

        // BARU GAMBAR GRAFIK (Gunakan setTimeout agar DOM benar-benar siap)
        setTimeout(() => {
          try {
            drawCharts(data);
          } catch (chartError) {
            console.error("Grafik gagal:", chartError);
            // Tetap lanjut meskipun grafik gagal agar saldo tidak hilang
          }
        }, 100);

      } catch (error) {
        console.error('Fatal Error:', error);
        showSystemError(error.message);
      } finally {
        showLoading(false);
      }
    }

    function updateSummary(data) {
      if (!data) return;
      // Gunakan innerText untuk keamanan
      const elBulan = document.getElementById('totalBulanIni');
      const elHari = document.getElementById('totalHariIni');
      const elNamaBulan = document.getElementById('namaBulan');

      if (elBulan) elBulan.innerText = 'Rp. ' + (data.totalBulanIni || 0).toLocaleString('id-ID');
      if (elHari) elHari.innerText = 'Rp. ' + (data.totalHariIni || 0).toLocaleString('id-ID');
      
      const skrg = new Date();
      if (elNamaBulan) elNamaBulan.innerText = skrg.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
    }

    function updatePieChart(labels, values, color) {
      const canvas = document.getElementById('pieChart');
      if (!canvas) return;
      
      if (currentPieChart) currentPieChart.destroy();
      
      currentPieChart = new Chart(canvas.getContext('2d'), {
        type: 'doughnut',
        data: {
          labels: labels || [],
          datasets: [{
            data: values || [],
            backgroundColor: [color, '#FB923C', '#FBBF24', '#34D399', '#60A5FA', '#A78BFA'],
            borderWidth: 1,
            borderColor: '#fff'
          }]
        },
        options: {
          cutout: '65%',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { usePointStyle: true, padding: 15, font: { size: 11 } } }
          }
        }
      });
    }

    function switchTab(type) {
      if (!chartData) return;
      
      const btnKeluar = document.getElementById('tabPengeluaran');
      const btnMasuk = document.getElementById('tabPemasukan');
      const year = chartData.currentYear || new Date().getFullYear(); /*tambahan baru*/
     
      if (type === 'pengeluaran') {
        btnKeluar.innerHTML = `Pengeluaran ${year}`; // Tambahkan keterangan tahun
        btnMasuk.innerHTML = `Pemasukan`;
        btnKeluar.className = "flex-1 pb-3 text-lg font-bold border-b-2 border-rose-600 text-rose-600 transition-all";
        btnMasuk.className = "flex-1 pb-3 text-lg font-bold border-b-2 border-transparent text-gray-400 transition-all";
        updatePieChart(chartData.kategoriLabels, chartData.kategoriValues, '#F43F5E');
      } else {
        btnKeluar.innerHTML = `Pengeluaran`;
        btnMasuk.innerHTML = `Pemasukan ${year}`; // Tambahkan keterangan tahun
        btnKeluar.className = "flex-1 pb-3 text-lg font-bold border-b-2 border-transparent text-gray-400 transition-all";
        btnMasuk.className = "flex-1 pb-3 text-lg font-bold border-b-2 border-green-600 text-green-600";
        updatePieChart(chartData.pemasukanLabels, chartData.pemasukanValues, '#0284C7');
      }
    }

    function drawCharts(data) {
      updatePieChart(data.kategoriLabels, data.kategoriValues, '#F43F5E');

      const canvasBar = document.getElementById('barChart');
      if (!canvasBar) return;
      
      if (currentBarChart) currentBarChart.destroy();

      currentBarChart = new Chart(canvasBar.getContext('2d'), {
        type: 'bar',
        data: {
          labels: (data.itemLabels || []).map((item, index) => [data.itemKategori[index] || '', item]),
          datasets: [{
            label: 'Nominal',
            data: data.itemValues || [],
            backgroundColor: 'rgba(139, 92, 246, 1)',
            borderRadius: 4,
            barThickness: 16
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { display: false },
            y: {
              grid: { display: false },
              ticks: { padding: 10, font: { size: 10, weight: '400', lineHeight: 1.25 } }
            }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    function renderRekap(rekap) {
      const container = document.getElementById('rekapHariIni');
      if (!container) return;
      if(!rekap || rekap.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-400 text-sm py-4">Tidak ada transaksi hari ini</p>';
        return;
      }
      container.innerHTML = rekap.map(item => `
        <div class="flex items-center justify-between pt-2 pb-2 bg-white mb-2 mt-2">
          <div>
            <p class="font-normal text-gray-900">${item.kategori}</p>
            <p class="text-xs text-gray-500">${item.items}</p>
          </div>
          <p class="font-normal text-gray-900 text-right">Rp. ${item.nominal.toLocaleString('id-ID')}</p>
        </div>
      `).join('');
    }

    function showLoading(show) {
      const l = document.getElementById('loading');
      const m = document.getElementById('mainContent');
      if (l) l.style.display = show ? 'flex' : 'none';
      if (m) m.style.display = show ? 'none' : 'block';
    }

    function showSystemError(msg) {
      const errorDiv = document.createElement('div');
      errorDiv.className = "bg-red-600 text-white p-4 rounded-xl m-4 text-xs font-mono fixed top-0 left-0 right-0 z-[9999]";
      errorDiv.innerHTML = "<b>Sistem Error:</b> " + msg;
      document.body.prepend(errorDiv);
    }

    fetchData();

      let currentViewDate = new Date();

// Modifikasi fungsi fetchData yang sudah ada
async function fetchData() {
    showLoading(true);
    const m = currentViewDate.getMonth() + 1;
    const y = currentViewDate.getFullYear();
    
    try {
        // Tambahkan parameter bulan dan tahun ke URL
        const response = await fetch(`${GAS_URL}?action=getData&month=${m}&year=${y}`);
        const data = await response.json();
        chartData = data;

        // Update bagian Saldo & Grafik lama
        updateSummary(data);
        drawCharts(data);
        renderRekap(data.rekapHariIni);

        // UPDATE BAGIAN BARU: Monthly Breakdown
        updateMonthlyBreakdown(data);
        
    } catch (error) {
        console.error(error);
    } finally {
        showLoading(false);
    }
}

function updateMonthlyBreakdown(data) {
    const inc = data.monthlyIncome || 0;
    const exp = data.monthlyExpense || 0;
    const max = Math.max(inc, exp) || 1; // Mencegah pembagian nol

    document.getElementById('breakdownInText').innerText = 'Rp. ' + inc.toLocaleString('id-ID');
    document.getElementById('breakdownOutText').innerText = 'Rp. ' + exp.toLocaleString('id-ID');
    document.getElementById('monthLabel').innerText = data.currentMonthName + " " + data.targetYear;

    // Set lebar bar secara proporsional
    document.getElementById('breakdownInBar').style.width = (inc / max * 100) + '%';
    document.getElementById('breakdownOutBar').style.width = (exp / max * 100) + '%';
}

function changeMonth(offset) {
    currentViewDate.setMonth(currentViewDate.getMonth() + offset);
    fetchData(); // Refresh data berdasarkan bulan baru
}
</script>
</body>
</html>
